name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Remplace par "master" si ta branche principale s'appelle master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Angular App
        # Remplace "NomDuRepo" par le nom exact de ton dépôt GitHub (ex: /mon-app/)
        run: npx ng build --base-href /Marcel/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # CRUCIAL : Pointer directement sur dist/browser
          path: './dist/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
